name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Companion server (Node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  app:
    name: iOS app (NSH check and headless tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh --version
      - name: Type-check
        run: nsh check app
      - name: Headless tests
        run: nsh test app
