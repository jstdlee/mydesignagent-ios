name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Companion server (Node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  app:
    name: iOS app (NSH check and headless tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh --version
      - name: Type-check
        run: nsh check app
      - name: Headless tests
        run: nsh test app

  desktop:
    name: Package (${{ matrix.target }})
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: macos-15
            target: macos
          - os: macos-15
            target: ios-simulator
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install NSH (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\nsh\bin"
      - name: Package
        run: nsh package app --target ${{ matrix.target }} -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: design-agent-${{ matrix.target }}
          path: dist

  screens:
    name: Screens (${{ matrix.target }})
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: ios
            tests: app/shots/phone.test.tsx
          - os: macos-15
            target: macos
            tests: app/shots/desktop.test.tsx
          - os: ubuntu-24.04
            target: linux
            tests: app/shots/desktop.test.tsx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install GTK and a display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 xvfb
          # WebKitGTK's sandbox needs unprivileged user namespaces, which Ubuntu 24.04 restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # xvfb has no GPU: render web views without DMA-BUF and compositing.
          echo "WEBKIT_DISABLE_DMABUF_RENDERER=1" >> "$GITHUB_ENV"
          echo "WEBKIT_DISABLE_COMPOSITING_MODE=1" >> "$GITHUB_ENV"
      - name: Run on the platform and take screenshots
        run: |
          mkdir -p screenshots
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" nsh test ${{ matrix.tests }} --target ${{ matrix.target }}
          else
            nsh test ${{ matrix.tests }} --target ${{ matrix.target }}
          fi
      - name: Print screenshots into the log (base64, for reviewers without artifact access)
        if: always()
        run: |
          [ "${{ runner.os }}" = macOS ] && for f in screenshots/*.png; do sips -Z 1400 "$f" >/dev/null; done
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "=====BEGIN $(basename "$f")====="
            python3 -c "import base64,sys,textwrap;print(textwrap.fill(base64.b64encode(open(sys.argv[1],'rb').read()).decode(),100))" "$f"
            echo "=====END $(basename "$f")====="
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.target }}
          path: screenshots
          if-no-files-found: warn

  e2e:
    name: End to end (app ↔ real server)
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start the server with a project of artifacts
        run: |
          echo "E2E_PROJECT=$RUNNER_TEMP/project" >> "$GITHUB_ENV"
          echo "DESIGNAGENT_SERVER_HOME=$RUNNER_TEMP/server-home" >> "$GITHUB_ENV"
          E2E_PROJECT=$RUNNER_TEMP/project DESIGNAGENT_SERVER_HOME=$RUNNER_TEMP/server-home e2e/setup.sh
      - name: Drive the app
        run: nsh test e2e/app.test.tsx
      - name: Check the agent's side
        run: node e2e/check.mjs "$E2E_PROJECT"
      - name: Server log
        if: always()
        run: cat "$DESIGNAGENT_SERVER_HOME/server.log" || true
